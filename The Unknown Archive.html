{id:"dajjal",t:"Dajjal",sum:"The 'false Messiah' of Islamic end-times tradition, described in hadith but not named in the Qur'an.",cat:"Religion & Eschatology",st:"doc",cult:"Islamic world",per:"8th c. onward (hadith literature)",rel:["mahdi","nafs","antichrist","creatures"],tags:"islam eschatology end times false messiah sunni shia signs of the hour",

{id:"mahdi",t:"The Mahdi & Signs of the Hour",sum:"The guided deliverer expected in Islamic end-times narratives, interpreted differently across Sunni and Shīʿa traditions.",cat:"Religion & Eschatology",st:"doc",cult:"Islamic world",per:"Early Islamic period",rel:["dajjal","barzakh"],tags:"islam eschatology imam end times",def:"Appears in the reports mainly as a figure connected to Dajjal's defeat. In Twelver Shīʿism the Imam al-Mahdī has a central, active role; Sunni early texts emphasise his role less in relation to Dajjal.",orig:"Treated in the uploaded material only in connection with Dajjal; no detailed origin account is given.",interp:"Shīʿī narrations: Mahdī guards believers, possibly defeats Dajjal before or alongside Jesus. Sunni: Mahdī spreads justice; Jesus kills Dajjal.",known:["Both branches include Mahdī in end-times belief"],unk:["The uploaded research is thin here — a good candidate for further sourcing"],mis:["'Sunni and Shīʿa views are identical.' Emphasis and role differ."],src:[["Religious scholarship","Shīʿī works such as al-Kāfi and Tafsir al-Mīzān (named in one report)"]]},
{id:"antichrist",t:"Antichrist & Other False Messiahs",sum:"Christian and Jewish parallels (Antichrist, Armilus) to Dajjal — related, but not identical.",cat:"Comparative Religion",st:"dis",cult:"Europe",per:"1st c. CE onward",rel:["dajjal"],tags:"christianity judaism armilus comparative",def:"Figures of ultimate deception in other traditions. The reports suggest historical influence on Dajjal narratives but caution that this is a scholarly reading, not a theological equivalence.",orig:"Report 2 outlines a path from Gospel warnings about false Christs, to Antichrist terminology, to Jewish Armilus, to 8th–10th c. Dajjal material.",interp:"Scholars see syncretic borrowing; believers see an independent prophetic tradition.",known:["Similar motifs exist across traditions"],unk:["Direction and extent of influence"],mis:["'They are the same figure.' Roles and theology differ."],src:[["Academic","Cook; Rodney Stark (cited in report 2)"]]},

{id:"dimensions",t:"Dimensions",sum:"From the 4D spacetime we inhabit to string theory's extra dimensions and mystical 'planes'.",cat:"Physics & Esoterica",st:"spec",cult:"Global / modern physics",per:"19th c. onward",rel:["multiverse","akashic","selves"],tags:"extra dimensions string theory kaluza klein brane planes kabbalah theosophy ancient dimensions",

{id:"simulation",t:"Simulation Hypothesis",sum:"The proposal that reality may be a computed simulation.",cat:"Philosophy & Physics",st:"spec",cult:"Global / modern physics",per:"2003",rel:["multiverse","dajjal"],tags:"bostrom holographic digital physics",def:"Nick Bostrom's 2003 argument. Related to the Holographic Principle in physics, often sensationalised into 'we live in a hologram'.",orig:"Echoes Descartes' evil demon; Bostrom 2003.",interp:"Report 2 draws a thematic parallel to Dajjal as 'deception of reality' — an interpretive comparison, not an established link.",known:["The Bekenstein–Hawking entropy and holography are real physics"],unk:["Whether any observation could test it"],mis:["Holographic principle ≠ proof of simulation."],src:[["Academic","Bostrom (cited in report 2)"]]},

{id:"jinn",t:"Jinn",sum:"Beings of 'smokeless fire' in Islamic cosmology, with free will — some believers, some not.",cat:"Religion & Mythology",st:"doc",cult:"Islamic world",per:"Pre-Islamic Arabia; Qur'an",rel:["creatures","dajjal"],tags:"islam genie unseen cosmology creatures from islamic tradition",def:"Mentioned in Sūrah 72 (al-Jinn) and hadith, per report 1. The 'genie in a lamp' of Aladdin is a later folk adaptation.",orig:"Pre-Islamic Arabian belief absorbed into Qur'anic teaching.",interp:"Religious tradition treats jinn as real unseen beings; folklore adds many embellishments.",known:["Textual references exist"],unk:["Not further analysed in the reports"],mis:["Genie-lamp imagery isn't the Islamic doctrine."],src:[["Religious text","Qur'an, Sūrah 72"]]},
{id:"cryptids",t:"Cryptids",sum:"Bigfoot, Nessie and other animals reported without scientific confirmation.",cat:"Paranormal",st:"dis",cult:"Americas & West",per:"19th–20th c.",rel:["paranormal","creatures"],tags:"bigfoot yeti loch ness chupacabra mothman",def:"Anecdotal reports. The 1934 'Surgeon's photograph' of Nessie was a hoax; the 1967 Patterson–Gimlin film remains disputed. DNA surveys at Loch Ness found no evidence (report 1).",orig:"Indigenous oral tales and mountaineers' reports.",interp:"Cryptozoology vs. mainstream zoology: sightings seen as misidentification or hoax.",known:["Several famous images are hoaxes"],unk:["Nothing peer-reviewed confirms any cryptid"],mis:["'No proof = proof of cover-up.'"],src:[["Popular","Patterson–Gimlin film; Loren Coleman (report 2)"]]},
{id:"backrooms",t:"The Backrooms",sum:"An endless maze of yellow rooms — born on a 2019 image board, grown into collaborative horror.",cat:"Internet Culture",st:"fic",cult:"Modern internet",per:"2019 – present",rel:["paranormal","mandela"],tags:"liminal creepypasta noclip internet horror kane parsons a24",def:"Began as an anonymous 4chan post (May 2019) about 'noclipping out of reality'. Community-written Levels and entities followed. Explicitly fictional.",orig:"Original caption plus later wikis, subreddits and Kane Parsons' videos.",interp:"Scholars of internet culture link its appeal to workplace monotony and uncanny familiarity.",known:["Origin in May 2019 on 4chan (both reports)"],unk:["Reports disagree: report 1 says the Parsons series ran 2019–2025 and an A24 film came in 2026; report 2 says series Jan 2022 and film Oct 2023. Verify before citing."],mis:["Not a real place or documented phenomenon."],src:[["Modern internet","Original 4chan post; Backrooms wikis"],["Popular","Pedestrian.TV (report 1)"]]},
{id:"paranormal",t:"Paranormal Phenomena",sum:"Ghosts, poltergeists, EVP and UFOs — what's reported, and what investigation found.",cat:"Paranormal",st:"dis",cult:"Global / cross-cultural",per:"Ancient onward; modern studies from 1900s",rel:["cryptids","mandela","selves"],tags:"ghost ufo uap infrasound poltergeist evp roswell blue book",def:"Tandy's work links infrasound (~19 Hz) to feelings of presence. Project Blue Book (1947–69) reviewed ~12,000 reports; most had ordinary explanations. Roswell was officially attributed to a Project Mogul balloon.",orig:"Spiritualism, psychical research, Cold War UFO programmes.",interp:"Parapsychology societies document cases; skeptics (Randi, CSI) replicate and debunk. Report 2 cites pareidolia and sleep paralysis.",known:["Infrasound can induce unease","Roswell debris was a balloon"],unk:["A small fraction of UAP reports remain unidentified — 'unidentified' means unknown, not alien"],mis:["'Unexplained' ≠ extraterrestrial."],src:[["Academic","Tandy & Lawrence 1998"],["Historical record","Project Blue Book; GAO 1995"],["Popular","Mary Roach, Spook"]]},
{id:"loa",t:"Law of Attraction",sum:"The New Thought belief that focused thought shapes outcomes — popularised by The Secret.",cat:"Psychology & Belief",st:"spec",cult:"Americas & West",per:"1855 – present",rel:["quantummysticism","selves"],tags:"manifestation secret new thought positive thinking",def:"Claims that thoughts and feelings attract matching events. No empirical support as a physical law (both reports).",orig:"Term appears 1855 (A. J. Davis); Quimby, Trine, Wattles, Hill; Byrne's The Secret, 2006.",interp:"Skeptics: confirmation bias and victim-blaming. Report 1 cites a 2023 PSPB study finding believers report higher perceived success but riskier behaviour. Some psychologists note optimism can boost persistence.",known:["Optimism can aid motivation"],unk:["Whether mindset effects exceed ordinary self-efficacy"],mis:["'Quantum physics proves it.' No."],src:[["Academic","Personality and Social Psychology Bulletin, 2023 (report 1)"],["Popular","Rhonda Byrne, The Secret"]]},
{id:"selves",t:"Seven Versions of the Self",sum:"Multi-layered models of identity from psychology and esoteric traditions.",cat:"Psychology & Esoterica",st:"spec",cult:"Global / cross-cultural",per:"19th–20th c.",rel:["nafs","dimensions","loa"],tags:"chakras theosophy barrett consciousness internal family systems jung",def:"No single authoritative seven-self list. Examples: Barrett's Seven Levels of Consciousness, seven chakras, Theosophical bodies, IFS parts. Report 2: no academic reference enumerates exactly seven.",orig:"Theosophy, Vedanta, Jung, Schwartz.",interp:"Chakras are treated as metaphor by scientific consensus (report 2).",known:["IFS is a recognised therapy model"],unk:["Whether 'seven' has any empirical basis"],mis:["'Science has mapped seven selves.' It hasn't."],src:[["Academic","Schwartz (IFS); Leary, Handbook of Self and Identity"]]},
{id:"nafs",t:"Nafs",sum:"The Islamic concept of the self — and the path from ego-driven desire to inner peace.",cat:"Religion & Psychology",st:"doc",cult:"Islamic world",per:"Qur'an; Sufi literature",rel:["selves","dajjal","barzakh"],tags:"soul ego sufi tazkiyah purification islam self discipline",def:"Three Qur'anic stages: ammāra (12:53), lawwāma (75:2), muṭmaʾinna (89:27–30). Practices: dhikr, muḥāsabah, riyāḍa. Al-Ghazali's Iḥyā' details tazkiyat an-nafs.",orig:"Qur'an and Sufi commentary.",interp:"Reports differ on later stages: report 1 says Shīʿī tradition adds raḍiyya and marḍiyya; report 2 adds mulhima, raḍiyya, marḍiyya and kāmila as Sufi elaborations, not explicit scripture.",known:["The three stages are Qur'anic"],unk:["Mapping onto modern psychology is interpretive (report 2 compares with Freud's id/ego)"],mis:["'Seven nafs are Qur'anic.' The three-stage framework is; extra stages are later."],src:[["Religious text","Qur'an 12:53, 75:2, 89:27–30"],["Religious scholarship","Al-Ghazali, Ibn al-Qayyim, Thanvi"]]},
